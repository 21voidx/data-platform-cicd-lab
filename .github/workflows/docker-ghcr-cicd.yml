name: Docker GHCR CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "transform.py"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/**"
      - "docker/**"
  push:
    branches:
      - main
    paths:
      - "transform.py"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/**"
      - "docker/**"      

jobs:
  docker-ci:
    name: Docker CI

    runs-on: ubuntu-latest

    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate production Compose
        env:
          APP_IMAGE: ghcr.io/example/example:test
        run: |
          docker compose \
            -f docker/compose.prod.yaml \
            config

      - name: Test Docker build
        run: |
          docker build \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            -t demo-ci:"$GITHUB_SHA" \
            docker

  publish:
    name: Publish Docker Image

    needs:
      - docker-ci

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Define immutable image name
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.image.outputs.image }}


  deploy:
    name: Deploy Immutable Docker Image

    needs:
      - publish

    environment:
      name: production

    runs-on:
      - self-hosted
      - Linux
      - X64

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login Home Server Docker to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy Compose file
        run: |
          cp \
            docker/compose.prod.yaml \
            /home/void/data-platform-cicd-lab/compose.prod.yaml

      - name: Pull and deploy exact image
        working-directory: /home/void/data-platform-cicd-lab
        env:
          APP_IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          docker compose \
            -f compose.prod.yaml \
            pull

          docker compose \
            -f compose.prod.yaml \
            up \
            -d \
            --remove-orphans

      - name: Smoke test
        run: |
          curl \
            --fail \
            --retry 10 \
            --retry-delay 2 \
            --retry-connrefused \
            http://127.0.0.1:8000