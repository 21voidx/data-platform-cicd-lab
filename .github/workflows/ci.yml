name: Python CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  python-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: |
          python -m compileall transform.py

      - name: Run tests
        run: |
          python -m pytest -v
  


  deploy:

    needs:
      - python-test

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    environment:
      name: production

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Copy application to VPS
        run: |
          scp \
            -P "${{ vars.VPS_PORT }}" \
            transform.py \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:${{ vars.DEPLOY_PATH }}/transform.py"

      - name: Deploy and verify
        run: |
          ssh \
            -p "${{ vars.VPS_PORT }}" \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            "
              echo '${GITHUB_SHA}' > '${{ vars.DEPLOY_PATH }}/VERSION'
              python3 '${{ vars.DEPLOY_PATH }}/transform.py' \
                > '${{ vars.DEPLOY_PATH }}/last-run.txt'
            "