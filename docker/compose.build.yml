services:
  demo:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-local}

    restart: unless-stopped

    ports:
      - "8010:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s